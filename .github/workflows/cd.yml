name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build all
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend to public_html
        run: |
          rsync -az --delete \
            --exclude '.DS_Store' \
            frontend/dist/public/ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.PUBLIC_HTML }}/

      - name: Deploy .htaccess
        run: |
          rsync -az \
            infra/cpanel/.htaccess \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.PUBLIC_HTML }}/.htaccess

      - name: Deploy backend to app directory
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'frontend/dist' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            --exclude '_image-masters' \
            --exclude 'uploads' \
            --exclude '*.tsbuildinfo' \
            ./ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.APP_DIR }}/

      - name: Install production dependencies
        run: |
          ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "cd ~/${{ secrets.APP_DIR }} && npm ci --omit=dev"

      - name: Restart Passenger
        run: |
          ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "mkdir -p ~/${{ secrets.APP_DIR }}/tmp && touch ~/${{ secrets.APP_DIR }}/tmp/restart.txt"

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf https://www.ergo.com.ph/api/healthz || echo "Health check failed (may need more time)"
