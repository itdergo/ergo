name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared + database (needed for project refs)
        run: npm run build:shared && npm run build:database
      - name: Typecheck
        run: npm run typecheck

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared + database
        run: npm run build:shared && npm run build:database
      - name: Run backend unit tests
        run: cd backend && npx vitest run

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Run frontend unit tests
        run: cd frontend && npx vitest run

  ui-quality:
    name: UI Quality (Accessibility & Performance)
    runs-on: ubuntu-latest
    needs: [frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for prerender
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Build shared packages
        run: npm run build:shared
      - name: Build frontend
        env:
          CHROME_BIN: chromium
        run: npm run build:frontend
      - name: Check bundle sizes
        run: |
          echo "=== Bundle Size Report ==="
          find frontend/dist/public/assets -name '*.js' -o -name '*.css' | while read f; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$size bytes  $f"
          done | sort -rn
          echo ""
          echo "=== Total JS size ==="
          find frontend/dist/public/assets -name '*.js' -exec stat -c%s {} \; | awk '{s+=$1} END {printf "%.1f KB\n", s/1024}'
          echo "=== Total CSS size ==="
          find frontend/dist/public/assets -name '*.css' -exec stat -c%s {} \; | awk '{s+=$1} END {printf "%.1f KB\n", s/1024}'
      - name: Verify WebP image variants exist
        run: |
          webp_count=$(find frontend/public/images/webp -name '*.webp' 2>/dev/null | wc -l)
          echo "WebP variants found: $webp_count"
          if [ "$webp_count" -lt 10 ]; then
            echo "WARNING: Expected at least 10 WebP variants, found $webp_count"
          fi
      - name: Verify prerendered pages
        run: |
          page_count=$(find frontend/dist/public -name 'index.html' | wc -l)
          echo "Prerendered pages: $page_count"
          if [ "$page_count" -lt 7 ]; then
            echo "ERROR: Expected at least 7 prerendered pages, found $page_count"
            exit 1
          fi
      - name: Verify sitemap exists
        run: |
          if [ -f frontend/dist/public/sitemap.xml ]; then
            echo "Sitemap: OK ($(wc -l < frontend/dist/public/sitemap.xml) lines)"
          else
            echo "WARNING: sitemap.xml not found"
          fi

      - name: Enforce bundle size budget
        run: |
          total_js=$(find frontend/dist/public/assets -name '*.js' -exec stat -c%s {} \; | awk '{s+=$1} END {printf "%.0f", s/1024}')
          echo "Total JS: ${total_js} KB (budget 500 KB)"
          if [ "${total_js}" -gt 500 ]; then
            echo "ERROR: JS bundle exceeds 500 KB budget"
            exit 1
          fi
          total_css=$(find frontend/dist/public/assets -name '*.css' -exec stat -c%s {} \; | awk '{s+=$1} END {printf "%.0f", s/1024}')
          echo "Total CSS: ${total_css} KB (budget 120 KB)"
          if [ "${total_css}" -gt 120 ]; then
            echo "ERROR: CSS bundle exceeds 120 KB budget"
            exit 1
          fi

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ergo
          POSTGRES_PASSWORD: ergo
          POSTGRES_DB: ergo_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ergo:ergo@localhost:5432/ergo_contracts
      NODE_ENV: test
      JWT_SECRET: ci-e2e-secret-not-for-production
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared + database packages
        run: npm run build:shared && npm run build:database
      - name: Push database schema
        run: npm run db:push
      - name: Seed database
        run: npm run seed
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd frontend && npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, backend-test, frontend-test, e2e-test, ui-quality, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build all
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/public
          retention-days: 7
      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/Dockerfile -t ergo-api:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f infra/Dockerfile.frontend -t ergo-frontend:${{ github.sha }} .
