name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared + database (needed for project refs)
        run: npm run build:shared && npm run build:database
      - name: Typecheck
        run: npm run typecheck

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared + database
        run: npm run build:shared && npm run build:database
      - name: Run backend unit tests
        run: cd backend && npx vitest run

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build:shared
      - name: Run frontend unit tests
        run: cd frontend && npx vitest run

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ergo
          POSTGRES_PASSWORD: ergo
          POSTGRES_DB: ergo_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ergo:ergo@localhost:5432/ergo_contracts
      NODE_ENV: test
      JWT_SECRET: ci-e2e-secret-not-for-production
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared + database packages
        run: npm run build:shared && npm run build:database
      - name: Push database schema
        run: npm run db:push
      - name: Seed database
        run: npm run seed
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd frontend && npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, backend-test, frontend-test, e2e-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build all
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/public
          retention-days: 7
      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/Dockerfile -t ergo-api:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f infra/Dockerfile.frontend -t ergo-frontend:${{ github.sha }} .
