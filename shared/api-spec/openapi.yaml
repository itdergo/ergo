openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: ERGO Contracts Philippines API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: categories
    description: Category operations
  - name: inquiries
    description: Contact form and inquiry management
  - name: resources
    description: Catalog and brochure resources
  - name: industries
    description: Industry verticals
  - name: solutions
    description: Service solutions
  - name: auth
    description: Authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, draft, archived] }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  total: { type: integer }
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /inquiries:
    get:
      operationId: listInquiries
      tags: [inquiries]
      summary: List inquiries
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Inquiry list
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewInquiry" }
      responses:
        "201":
          description: Created
  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List resources
      responses:
        "200":
          description: Resource list
  /industries:
    get:
      operationId: listIndustries
      tags: [industries]
      summary: List industries
      responses:
        "200":
          description: Industry list
  /solutions:
    get:
      operationId: listSolutions
      tags: [solutions]
      summary: List solutions
      responses:
        "200":
          description: Solution list
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
                name: { type: string }
                role: { type: string }
      responses:
        "201":
          description: Created
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        shortDescription: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        galleryImages: { type: array, items: { type: string } }
        specifications: { type: object, additionalProperties: { type: string } }
        price: { type: integer, nullable: true }
        status: { type: string }
        orderIndex: { type: integer }
        isFeatured: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NewProduct:
      type: object
      properties:
        categoryId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        shortDescription: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        galleryImages: { type: array, items: { type: string } }
        specifications: { type: object, additionalProperties: { type: string } }
        price: { type: integer, nullable: true }
        status: { type: string }
        orderIndex: { type: integer }
        isFeatured: { type: boolean }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        orderIndex: { type: integer }
        isActive: { type: boolean }
    NewInquiry:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        company: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        message: { type: string }
        source: { type: string }
      required: [name, email, message]
