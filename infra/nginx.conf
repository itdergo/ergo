server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth; API also sets these via helmet).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Content-Security-Policy. script-src allows: same-origin scripts, the
    # prerendered inline Plausible loader (pinned by SHA-256 hash so no
    # 'unsafe-inline' is needed), and Plausible itself. style-src keeps
    # 'unsafe-inline' because the contact section sets inline style objects and
    # Tailwind is injected at build time; inline styles are not a script vector.
    # frame-src allows the Google Maps embed iframe on the contact page.
    # If the inline Plausible loader in index.html is edited, regenerate the hash:
    #   python3 -c "import hashlib,base64,re;h=open('frontend/dist/public/index.html').read();m=re.search(r'<script>(.*?)</script>',h,re.S);print('sha256-'+base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())"
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'sha256-qjOiduFJoFma5ZnoIU1u7vg0uFA8SuZmoWEBSKGdGmI=' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src https://www.google.com; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        # The API mounts everything under /api, so uploads live at /api/uploads.
        # proxy_pass with a URI part rewrites the /uploads prefix to /api.
        proxy_pass http://api:5000/api;
    }
}
